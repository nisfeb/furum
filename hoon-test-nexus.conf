# hoon-test-kit, for the grubbery nexus in code/ (the Gall desk's suites
# are hoon-test.conf's). Run with HOON_TEST_CONF=hoon-test-nexus.conf on a
# fake ship with %grubbery installed. See docs/hoon-testing.md.

# the test desk: never the app's own, and not the Gall suites' either
DESK=furum-nexus-test

DIALECT=grubbery
CODE=code

# the libs, and the nexus itself (its fibers run through +on-file)
LIBS="code/lib/furum-types.hoon code/lib/cashu.hoon code/lib/furum-theme.hoon code/lib/furum-rules.hoon code/lib/furum.hoon code/lib/furum-board.hoon code/lib/furum-registry.hoon code/nex/furum/app.hoon"

TESTS=tests/nexus

# the faces grubbery puts in every build subject that this code uses
PRELUDE="tarball nexus loader server io=fiberio"

# those libs, at the version the ship runs, and what they import
SHIP_FILES="grubbery:lib/tarball.hoon grubbery:lib/multipart.hoon grubbery:lib/nexus.hoon grubbery:sur/push.hoon grubbery:lib/loader.hoon grubbery:lib/server.hoon grubbery:lib/http-utils.hoon grubbery:lib/fiberio.hoon"

FILES="scripts/hoon-test-kit/hoon/fiber-test.hoon=lib/fiber-test.hoon"

MARKS="json mime svg"
