# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md and
# docs/hoon-testing.md.

# the test desk: never the app's own
DESK=furum-test

# the libs under test (hoon-mutate.py mutates these), and the libs they import
LIBS="desk/lib/cashu.hoon desk/lib/furum-rules.hoon desk/lib/furum.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

# the types every lib imports
FILES="desk/sur/furum.hoon=sur/furum.hoon"

# marks copied from %base at setup
MARKS="json mime"
